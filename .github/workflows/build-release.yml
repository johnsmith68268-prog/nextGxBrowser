name: Build Windows & Linux Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # NOTE (s-11): build:win:all intentionally builds NSIS + portable only.
      # The MSIX target is unsigned (publisher CN=Marjan, no code-signing
      # certificate) and will not install on a normal Windows machine without
      # developer mode. Build it opt-in with `npm run build:win:msix` once a
      # code-signing certificate is configured (see "appx" in package.json).
      - run: npm run build:win:all
      - uses: actions/upload-artifact@v4
        with:
          name: nextgx-windows-x64
          path: |
            dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: nextgx-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb

  # S-1: publish a real GitHub Release on tag pushes. Without this, no Release
  # ever existed, so scripts/install-linux.sh (which fetches the .AppImage
  # from .../releases/latest) always failed. This job also publishes
  # SHA256SUMS.txt so the installer can verify downloads (s-10).
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets and generate SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp -t release-assets {} +
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
