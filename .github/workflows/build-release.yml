name: Build Windows & Linux Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const pkgVer = require('./package.json').version; const tagVer = String(process.env.TAG_NAME || '').replace(/^v/, ''); if (pkgVer !== tagVer) { console.error('Tag version (' + tagVer + ') !== package.json version (' + pkgVer + ')'); process.exit(1); }"
        env:
          TAG_NAME: ${{ github.ref_name }}
      - run: npm test
      - run: npm run build:win:all
      - run: npm run build:win:msix
      - uses: actions/upload-artifact@v4
        with:
          name: nextgx-windows-x64
          path: |
            dist/*.exe
            dist/*.msix

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const pkgVer = require('./package.json').version; const tagVer = String(process.env.TAG_NAME || '').replace(/^v/, ''); if (pkgVer !== tagVer) { console.error('Tag version (' + tagVer + ') !== package.json version (' + pkgVer + ')'); process.exit(1); }"
        env:
          TAG_NAME: ${{ github.ref_name }}
      - run: npm test
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: nextgx-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb

  # S-1: publish a real GitHub Release on tag pushes. Without this, no Release
  # ever existed, so scripts/install-linux.sh (which fetches the .AppImage
  # from .../releases/latest) always failed. This job also publishes
  # SHA256SUMS.txt so the installer can verify downloads (s-10).
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets and generate SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.msix' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp -t release-assets {} +
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.msix
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
      - name: Remove older GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          OLD_TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' || true)
          for tag in $OLD_TAGS; do
            if [ -n "$tag" ] && [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old release $tag..."
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          done
