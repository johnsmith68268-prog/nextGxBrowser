<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Dial</title>
  <style>
    :root {
      --bg-base: #151320;
      --bg-input: #232034;
      --text-main: #f3f1f8;
      --text-muted: #8e88a6;
      --accent: #9d4edd;
      --accent-bright: #c77dff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image:
        linear-gradient(rgba(157, 78, 221, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(157, 78, 221, 0.045) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(157, 78, 221, 0.16), transparent 60%);
      background-size: 46px 46px, 46px 46px, 100% 100%;
      color: var(--text-main);
      font-family: 'Inter', 'Segoe UI', Ubuntu, Cantarell, sans-serif;
      display: flex;
      padding-left: 50px;
    }

    /* Floating Left Opera GX Sidebar Strip on Speed Dial */
    .gx-left-strip {
      position: fixed;
      top: 0;
      left: 0;
      width: 46px;
      height: 100vh;
      background: #100e19;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      z-index: 20;
    }

    .strip-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .strip-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.15s;
    }

    .strip-btn:hover {
      background: rgba(157, 78, 221, 0.2);
      border-color: var(--accent);
      color: #fff;
    }

    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 76px 28px 40px;
    }

    .gx-search-bar {
      width: 100%;
      max-width: 540px;
      height: 44px;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      margin-bottom: 44px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .gx-search-bar:focus-within {
      border-color: var(--accent);
    }

    .google-badge {
      width: 24px;
      height: 24px;
      background: #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #4285f4;
    }

    .gx-search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13.5px;
    }

    .dial-section {
      width: 100%;
      max-width: 820px;
      margin-bottom: 38px;
    }

    .section-heading {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .dial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
      gap: 14px;
    }

    .dial-tile {
      height: 82px;
      border-radius: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      cursor: pointer;
      text-decoration: none;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.32);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .dial-tile:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .tile-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .tile-del {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: none;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 10px;
      opacity: 0;
      cursor: pointer;
    }

    .dial-tile:hover .tile-del {
      opacity: 1;
    }

    .dial-tile.add-tile {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 22px;
      color: var(--text-muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 340px;
      background: #1d1a2b;
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-box input {
      background: #12101b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12.5px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #28243b;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <!-- Left Opera GX Sidebar Strip -->
  <aside class="gx-left-strip">
    <div class="strip-group">
      <button class="strip-btn" data-open-side="control" title="GX Control — RAM & CPU Saver">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12 19 5"/></svg>
      </button>
      <button class="strip-btn" data-open-side="cleaner" title="GX Cleaner">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>
      <button class="strip-btn" data-open-side="twitch" title="Twitch">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#a970ff" stroke-width="2"><path d="M21 2H3v16h5v4l4-4h5l4-4V2zm-10 9V7m5 4V7"/></svg>
      </button>
      <button class="strip-btn" data-open-side="ai" title="ChatGPT / AI">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#10a37f" stroke-width="2"><path d="M12 2a4 4 0 0 1 4 4v1a4 4 0 0 1 2.5 6.8A4 4 0 0 1 15 20h-1a4 4 0 0 1-7-2.2A4 4 0 0 1 5.5 11 4 4 0 0 1 8 4.2 4 4 0 0 1 12 2z"/></svg>
      </button>
      <button class="strip-btn" data-open-side="music" title="Player — YouTube Music, Spotify, SoundCloud">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="strip-group">
      <button class="strip-btn" data-open-side="setup" title="Sidebar Setup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
  </aside>

  <div class="main-wrap">
    <form class="gx-search-bar" id="searchForm">
      <div class="google-badge">G</div>
      <input type="text" id="searchInput" placeholder="Search the web" autocomplete="off" />
    </form>

    <section class="dial-section">
      <div class="dial-grid" id="dialGrid"></div>
    </section>

    <section class="dial-section">
      <div class="section-heading">Suggestions</div>
      <div class="dial-grid">
        <a class="dial-tile" href="https://www.youtube.com" style="background:linear-gradient(135deg,#c9182b,#7f0d19)">
          <span class="tile-title">youtube.com</span>
        </a>
        <a class="dial-tile" href="https://chromewebstore.google.com" style="background:linear-gradient(135deg,#1d4ed8,#1e3a8a)">
          <span class="tile-title">chromewebstore</span>
        </a>
        <a class="dial-tile" href="https://www.opera.com/gx/gx-corner" style="background:linear-gradient(135deg,#4c1d95,#2e1065)">
          <span class="tile-title">GX Corner</span>
        </a>
        <a class="dial-tile" href="https://studio.youtube.com" style="background:linear-gradient(135deg,#991b1b,#450a0a)">
          <span class="tile-title">studio.youtube</span>
        </a>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="addModal">
    <form class="modal-box" id="addDialForm">
      <h3>Add Speed Dial</h3>
      <input type="text" id="dialTitleInput" placeholder="Title (e.g. Twitch)" required />
      <input type="text" id="dialUrlInput" placeholder="Address (e.g. twitch.tv)" required />
      <div class="modal-actions">
        <button type="button" class="btn" id="btnCancelModal">Cancel</button>
        <button type="submit" class="btn primary">Add</button>
      </div>
    </form>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
