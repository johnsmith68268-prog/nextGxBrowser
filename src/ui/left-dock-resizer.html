<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resizer</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #9d4edd;
      opacity: 0.35;
      cursor: ew-resize;
      transition: opacity 0.15s;
    }
    body:hover, body.dragging {
      opacity: 1;
    }
  </style>
</head>
<body>
  <script>
    let dragging = false;
    let startScreenX = 0;
    let startWidth = 420;

    window.addEventListener('mousedown', async (e) => {
      e.preventDefault();
      dragging = true;
      document.body.classList.add('dragging');
      startScreenX = e.screenX;
      const s = await window.gxAPI.getSettings();
      startWidth = s.leftPanelWidth || 420;
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const delta = e.screenX - startScreenX;
      const nextWidth = Math.max(280, Math.min(880, startWidth + delta));
      window.gxAPI.resizeLeftWebPanel(nextWidth);
    });

    window.addEventListener('mouseup', () => {
      if (dragging) {
        dragging = false;
        document.body.classList.remove('dragging');
      }
    });
  </script>
</body>
</html>
