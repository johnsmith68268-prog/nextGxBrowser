<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nextGx System Settings & Manager</title>
  <style>
    :root {
      --bg-page: #13111c;
      --bg-sidebar: #181524;
      --bg-card: #211d30;
      --bg-input: #100e18;
      --text-primary: #f4f5f8;
      --text-secondary: #938da9;
      --accent: #9d4edd;
      --accent-bright: #c77dff;
      --accent-soft: rgba(157, 78, 221, 0.2);
      --border: rgba(255, 255, 255, 0.085);
      --specular: inset 0 1px 0 rgba(255, 255, 255, 0.09);
      --danger: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Ubuntu, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* iOS / macOS Pill Toggle Switch */
    .nx-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 23px;
      flex-shrink: 0;
    }

    .nx-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .nx-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      transition: background-color 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.22s;
    }

    .nx-slider::before {
      position: absolute;
      content: "";
      height: 17px;
      width: 17px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nx-switch input:checked + .nx-slider {
      background-color: var(--accent);
      border-color: var(--accent-bright);
    }

    .nx-switch input:checked + .nx-slider::before {
      transform: translateX(17px);
    }

    /* Segmented Pill Control */
    .nx-segmented {
      display: inline-flex;
      background: var(--bg-input);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border);
      gap: 3px;
    }

    .seg-btn {
      padding: 5px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.16s;
    }

    .seg-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--specular), 0 2px 6px rgba(0, 0, 0, 0.28);
    }

    /* Header Bar */
    .webui-topbar {
      height: 60px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .webui-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 600;
    }

    .webui-brand span.badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 7px;
    }

    .webui-search {
      width: 440px;
      max-width: 48vw;
      height: 36px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
    }

    .webui-search:focus-within {
      border-color: var(--accent-bright);
    }

    .webui-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
    }

    .webui-right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .webui-layout {
      flex: 1;
      display: flex;
    }

    .webui-nav {
      width: 240px;
      min-width: 240px;
      background: var(--bg-page);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-right: 1px solid var(--border);
    }

    .nav-link {
      height: 38px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }

    .nav-link.active {
      background: var(--bg-card);
      border-color: var(--border);
      box-shadow: var(--specular);
      color: var(--text-primary);
      font-weight: 600;
    }

    .webui-main {
      flex: 1;
      padding: 28px 40px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--specular), 0 8px 24px rgba(0, 0, 0, 0.24);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header h2 {
      font-size: 14.5px;
      font-weight: 600;
    }

    .card-row {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13.5px;
    }

    .card-row:last-child {
      border-bottom: none;
    }

    .row-info {
      flex: 1;
      overflow: hidden;
    }

    .row-title {
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .row-title:hover {
      color: var(--accent-bright);
    }

    .row-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .progress-track {
      height: 6px;
      background: var(--bg-input);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #38bdf8);
      transition: width 0.25s;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #232738;
      box-shadow: var(--specular);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn:hover {
      border-color: var(--accent-bright);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #fff;
      font-weight: 600;
    }

    .btn.danger:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .input-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .ext-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .ext-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--specular);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .ext-top {
      display: flex;
      gap: 14px;
    }

    .ext-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .ext-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <header class="webui-topbar">
    <div class="webui-brand">
      <span class="badge">nextGx</span>
      <span id="pageHeaderTitle">History</span>
    </div>

    <div class="webui-search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#938da9" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="globalSearchInput" placeholder="Search..." />
    </div>

    <div class="webui-right-actions" id="topRightActions"></div>
  </header>

  <div class="webui-layout">
    <aside class="webui-nav">
      <button class="nav-link" data-page="history">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        History
      </button>
      <button class="nav-link" data-page="downloads">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Downloads
      </button>
      <button class="nav-link" data-page="bookmarks">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Bookmarks
      </button>
      <button class="nav-link" data-page="passwords">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Passwords & Autofill
      </button>
      <button class="nav-link" data-page="extensions">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.5 0 2.7 1.2 2.7 2.7S5 16.2 3.5 16.2H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.5 1.2-2.7 2.7-2.7s2.7 1.2 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
        Extensions
      </button>
      <button class="nav-link" data-page="settings">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings & Memory
      </button>
    </aside>

    <main class="webui-main" id="mainContainer"></main>
  </div>

  <script src="chrome-webui.js"></script>
</body>
</html>
