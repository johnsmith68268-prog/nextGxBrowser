<!DOCTYPE html>
<html lang="en" data-theme="gx-violet">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nextGx System Settings & Manager</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Market audit bug #26: the red brand accent. Theme accents stay
       theme-driven (var(--accent)), but the confirm modal and other
       brand surfaces in these WebUI pages use this fixed red so the
       destructive/profile confirmations read as nextGx red, not violet. */
    :root {
      --nx-brand: #FA1E4E;
      --nx-brand-bright: #FF4D73;
      --nx-brand-soft: rgba(250, 30, 78, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg-page);
      background-image:
        linear-gradient(var(--nx-grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--nx-grid-line) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, var(--nx-accent-soft), transparent 45%);
      background-size: 48px 48px, 48px 48px, 100% 100%;
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--nx-font-sans);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* Smooth Pill Toggle Switch */
    .nx-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 23px;
      flex-shrink: 0;
    }

    .nx-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .nx-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--nx-glass-strong);
      border: 1px solid var(--border);
      border-radius: var(--nx-radius-pill);
      transition: background-color var(--nx-motion-base) var(--nx-motion-ease), border-color var(--nx-motion-base) var(--nx-motion-ease), box-shadow var(--nx-motion-base) var(--nx-motion-ease);
    }

    .nx-slider::before {
      position: absolute;
      content: "";
      height: 17px;
      width: 17px;
      left: 2px;
      bottom: 2px;
      background-color: var(--nx-white);
      border-radius: 50%;
      box-shadow: var(--nx-shadow-sm);
      transition: transform var(--nx-motion-base) var(--nx-motion-ease);
    }

    .nx-switch input:checked + .nx-slider {
      background-color: var(--accent);
      border-color: var(--accent-bright);
      box-shadow: var(--nx-glow-sm);
    }

    .nx-switch input:checked + .nx-slider::before {
      transform: translateX(17px);
    }

    .nx-switch input:disabled + .nx-slider {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Segmented Pill Control */
    .nx-segmented {
      display: inline-flex;
      background: var(--bg-input);
      padding: 3px;
      border-radius: var(--nx-radius-md);
      border: 1px solid var(--border);
      gap: 3px;
    }

    .nx-segmented.theme-seg-wrap {
      flex-wrap: wrap;
      max-width: 560px;
    }

    .seg-btn {
      padding: 5px 12px;
      border-radius: var(--nx-radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--nx-motion-fast) var(--nx-motion-ease), color var(--nx-motion-fast) var(--nx-motion-ease), border-color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .seg-btn:hover {
      color: var(--text-primary);
    }

    .seg-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-bright);
      box-shadow: var(--specular), var(--nx-glow-sm);
    }

    .nx-segmented.is-disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .seg-btn:disabled {
      cursor: not-allowed;
      pointer-events: none;
    }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .theme-dot.gx-violet { background: var(--nx-swatch-violet); }
    .theme-dot.crimson { background: var(--nx-swatch-crimson); }
    .theme-dot.cyan { background: var(--nx-swatch-cyan); }
    .theme-dot.emerald { background: var(--nx-swatch-emerald); }
    .theme-dot.magenta { background: var(--nx-swatch-magenta); }
    .theme-dot.amber { background: var(--nx-swatch-amber); }
    .theme-dot.lime { background: var(--nx-swatch-lime); }
    .theme-dot.ice { background: var(--nx-swatch-ice); }

    /* Theme preview cards (Opera-style mini window mock per theme) */
    .seg-btn.theme-card {
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      padding: 8px 10px 7px;
    }

    .theme-card-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .theme-preview {
      display: block;
      width: 68px;
      height: 42px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #12101b;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Mini window: accent title bar + dots, dark body, accent tab */
    .theme-preview::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 11px;
      background: var(--nx-swatch-violet);
    }

    .theme-preview::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 17px;
      width: 30px;
      height: 5px;
      border-radius: 3px;
      background: var(--nx-swatch-violet);
      opacity: 0.85;
      box-shadow: 0 9px 0 -1px rgba(255, 255, 255, 0.14), 0 18px 0 -1px rgba(255, 255, 255, 0.08);
    }

    .theme-preview.gx-violet::before, .theme-preview.gx-violet::after { background: var(--nx-swatch-violet); }
    .theme-preview.crimson::before, .theme-preview.crimson::after { background: var(--nx-swatch-crimson); }
    .theme-preview.cyan::before, .theme-preview.cyan::after { background: var(--nx-swatch-cyan); }
    .theme-preview.emerald::before, .theme-preview.emerald::after { background: var(--nx-swatch-emerald); }
    .theme-preview.magenta::before, .theme-preview.magenta::after { background: var(--nx-swatch-magenta); }
    .theme-preview.amber::before, .theme-preview.amber::after { background: var(--nx-swatch-amber); }
    .theme-preview.lime::before, .theme-preview.lime::after { background: var(--nx-swatch-lime); }
    .theme-preview.ice::before, .theme-preview.ice::after { background: var(--nx-swatch-ice); }

    .hidden {
      display: none !important;
    }

    /* Settings Sound Controls & Designed Empty State */
    .sounds-settings-row {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    .sounds-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sounds-volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--nx-radius-md);
      background: var(--bg-input);
      border: 1px solid var(--border);
      transition: opacity var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .sounds-volume-row.is-disabled {
      opacity: 0.5;
    }

    .sounds-vol-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 52px;
    }

    .nx-range {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--nx-radius-pill);
      outline: none;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .nx-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent-bright);
      border: 2px solid var(--accent);
      box-shadow: var(--nx-glow-sm);
      cursor: pointer;
      transition: transform var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .nx-range:hover:not(:disabled)::-webkit-slider-thumb {
      transform: scale(1.1);
      box-shadow: var(--nx-glow-md);
    }

    .nx-range:disabled {
      cursor: not-allowed;
    }

    .nx-range:disabled::-webkit-slider-thumb {
      background: var(--text-secondary);
      border-color: var(--border);
      box-shadow: none;
      cursor: not-allowed;
    }

    .sounds-vol-value {
      min-width: 40px;
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-bright);
    }

    .nx-empty-inline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--nx-radius-md);
      box-shadow: var(--specular);
    }

    .nx-empty-inline-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .nx-empty-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--nx-radius-sm);
      clip-path: var(--nx-chamfer-sm);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent-bright);
      box-shadow: var(--nx-glow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nx-empty-copy {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Header Bar */
    .webui-topbar {
      height: 60px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--nx-accent-soft);
      box-shadow: inset 0 -1px 0 var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .webui-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 600;
    }

    .webui-brand span.badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
      color: var(--nx-on-accent);
      font-family: var(--nx-font-display);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: var(--nx-radius-xs);
      clip-path: var(--nx-chamfer-sm);
      box-shadow: var(--nx-glow-sm);
    }

    #pageHeaderTitle {
      font-size: 16px;
      color: var(--text-primary);
    }

    .webui-search {
      width: 440px;
      max-width: 48vw;
      height: 36px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--nx-radius-md);
      clip-path: var(--nx-chamfer-sm);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      transition: border-color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .webui-search svg {
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .webui-search:focus-within {
      border-color: var(--accent);
      box-shadow: var(--nx-glow-md), inset 0 0 8px var(--nx-accent-soft);
    }

    .webui-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
    }

    .webui-right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .webui-layout {
      flex: 1;
      display: flex;
    }

    .webui-nav {
      width: 240px;
      min-width: 240px;
      background: var(--bg-sidebar);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-right: 1px solid var(--border);
      /* Market audit bug #10: the nav scrolled away with the page. Keep it
         pinned while the main column scrolls. It sits below the 60px
         sticky topbar, so stick at top:60px (not 0, where the topbar
         would cover its first rows). Height stays 100vh (pinned by the
         existing MA-10 test); the nav scrolls internally via overflow-y. */
      position: sticky;
      top: 60px;
      align-self: flex-start;
      height: 100vh;
      overflow-y: auto;
    }

    .nav-link {
      height: 38px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: background var(--nx-motion-fast) var(--nx-motion-ease), border-color var(--nx-motion-fast) var(--nx-motion-ease), color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .nav-link:focus-visible,
    .btn:focus-visible,
    .settings-tab-pill:focus-visible {
      outline: 2px solid var(--accent-bright);
      outline-offset: 2px;
    }

    html[data-focus-highlight="true"] *:focus-visible {
      outline: 3px solid var(--accent-bright) !important;
      outline-offset: 2px !important;
    }

    .nav-link:hover {
      background: var(--nx-glass-subtle);
      border-color: var(--nx-accent-soft);
      color: var(--text-primary);
    }

    .nav-link.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: var(--specular), var(--nx-glow-sm), inset 3px 0 0 var(--accent-bright);
      color: var(--text-primary);
      font-weight: 600;
    }

    .webui-main {
      flex: 1;
      padding: 28px 40px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    /* Chrome Clarity × Opera GX Balance: standard utility cards stay clean & calm;
       GX Studio / GX Performance hero cards carry the signature neon top hairline. */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--nx-shadow-sm, 0 4px 14px rgba(0, 0, 0, 0.22));
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .section-card.section-card--gx {
      border-top: 2px solid var(--accent);
      box-shadow: var(--specular), var(--nx-shadow-lg);
    }

    .settings-subnav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .settings-tab-pill {
      padding: 6px 13px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .settings-tab-pill:hover {
      background: var(--nx-glass-subtle);
      color: var(--text-primary);
    }

    .settings-tab-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .settings-tab-pill.gx-pill.active {
      border-color: var(--nx-brand, #FA1E4E);
      box-shadow: 0 0 10px color-mix(in srgb, var(--nx-brand, #FA1E4E) 25%, transparent);
    }

    .sidebar-dock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
      gap: 8px;
      width: 100%;
    }

    .sidebar-dock-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      font-size: 12.5px;
      color: var(--text-primary);
      cursor: pointer;
    }

    .sidebar-dock-item input[type="checkbox"] {
      accent-color: var(--accent);
    }

    .gxmod-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg-input);
      margin-bottom: 6px;
    }

    .io-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      margin: 12px 20px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      font-size: 12.5px;
    }

    .io-banner.warning {
      border-color: color-mix(in srgb, var(--warning, #f59e0b) 55%, transparent);
      background: color-mix(in srgb, var(--warning, #f59e0b) 10%, var(--bg-input));
    }

    .io-banner-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .io-banner-detail {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 0 20px 12px;
    }

    .io-banner .io-banner-detail {
      padding: 0;
    }

    .card-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      text-transform: none;
    }

    .section-card--gx .card-header h2 {
      color: var(--accent-bright);
    }

    .card-row {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13.5px;
      transition: background var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .card-row:hover {
      background: var(--nx-glass-subtle);
    }

    .card-row:last-child {
      border-bottom: none;
    }

    .row-info {
      flex: 1;
      overflow: hidden;
    }

    .row-title {
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }

    .row-title.open-link,
    .row-title.open-bm,
    .row-title.open-file,
    .row-title.reopen-closed-link {
      cursor: pointer;
    }

    /* Market audit bug #25: name labels (history / bookmark titles) were
       cut mid-word on one line ("YouTube Mu…"). Two-line wrap with a
       clean ellipsis instead of a single clipped line. Applied in JS to
       the name labels only; filenames/URLs keep the single-line ellipsis. */
    .row-title--clamp2 {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.35;
      word-break: break-word;
    }

    .row-title.open-link:hover,
    .row-title.open-bm:hover,
    .row-title.open-file:hover,
    .row-title.reopen-closed-link:hover {
      color: var(--accent-bright);
    }

    .row-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .progress-track {
      height: 6px;
      background: var(--bg-input);
      border-radius: var(--nx-radius-pill);
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      box-shadow: var(--nx-glow-sm);
      transition: width 0.25s;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      box-shadow: var(--specular);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--nx-motion-fast) var(--nx-motion-ease), border-color var(--nx-motion-fast) var(--nx-motion-ease), color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .btn:hover {
      border-color: var(--accent-bright);
      color: var(--accent-bright);
      box-shadow: var(--nx-glow-sm);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: var(--nx-on-accent);
      box-shadow: var(--nx-glow-sm);
      font-weight: 700;
    }

    .btn.primary:hover {
      background: var(--accent-bright);
      color: var(--nx-on-accent);
      box-shadow: var(--nx-glow-md);
    }

    .btn.danger:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: var(--nx-white);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .settings-homepage-form {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .settings-homepage-input {
      width: 280px;
      max-width: 100%;
    }

    .settings-form-msg {
      font-size: 12px;
      margin-top: 5px;
      font-weight: 500;
    }

    .settings-form-msg.error {
      color: var(--danger);
    }

    .settings-form-msg.success {
      color: var(--success);
    }

    .input-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: var(--nx-radius-md);
      font-size: 13px;
      outline: none;
      transition: border-color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .input-box:focus {
      border-color: var(--accent);
      box-shadow: var(--nx-glow-sm);
    }

    .ext-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .ext-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      box-shadow: var(--specular), var(--nx-shadow-md);
      border-radius: var(--nx-radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: border-color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .ext-card:hover {
      border-color: var(--accent);
      box-shadow: var(--specular), var(--nx-glow-sm);
    }

    .ext-card.disabled {
      border-top-color: var(--border);
      opacity: 0.78;
    }

    .ext-card.disabled .ext-icon {
      background: var(--bg-input);
      border-color: var(--border);
      color: var(--text-secondary);
      box-shadow: none;
    }

    .ext-banner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      border-radius: var(--nx-radius-lg);
      border: 1px solid var(--border);
      background: var(--bg-card);
      box-shadow: var(--specular), var(--nx-shadow-md);
      margin-bottom: 18px;
      font-size: 13px;
    }

    .ext-banner.error {
      border-color: var(--danger);
      border-left: 3px solid var(--danger);
    }

    .ext-banner.warning {
      border-color: var(--warning);
      border-left: 3px solid var(--warning);
    }

    .ext-banner.success {
      border-color: var(--success);
      border-left: 3px solid var(--success);
    }

    .ext-banner.info {
      border-color: var(--accent);
      border-left: 3px solid var(--accent);
    }

    .ext-banner-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .ext-banner.error .ext-banner-title { color: var(--danger); }
    .ext-banner.warning .ext-banner-title { color: var(--warning); }
    .ext-banner.success .ext-banner-title { color: var(--success); }
    .ext-banner.info .ext-banner-title { color: var(--accent-bright); }

    .ext-banner-detail {
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.45;
      word-break: break-word;
    }

    .ext-banner-list {
      margin-top: 6px;
      padding-left: 18px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.45;
    }

    .ext-meta-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .ext-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--nx-radius-xs);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-secondary);
    }

    .ext-pill.active {
      border-color: var(--success);
      color: var(--success);
    }

    .ext-pill.mv {
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    .ext-dev-meta {
      margin-top: 8px;
      font-size: 11.5px;
      color: var(--text-secondary);
      word-break: break-all;
      line-height: 1.45;
    }

    .ext-note {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: var(--nx-radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border);
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .ext-note.warning {
      border-color: var(--warning);
      color: var(--warning);
    }

    .ext-note.error {
      border-color: var(--danger);
      color: var(--danger);
    }

    .ext-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ext-top {
      display: flex;
      gap: 14px;
    }

    .ext-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--nx-radius-md);
      clip-path: var(--nx-chamfer-sm);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent-bright);
      box-shadow: var(--nx-glow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .ext-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    /* UX phase: nicer empty states — art + title + copy + action, not just "0". */
    .nx-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      padding: 34px 20px;
      color: var(--text-secondary);
    }

    .nx-empty-state .nx-empty-art {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: var(--bg-surface, #221e33);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--nx-accent-bright, #FF4D73);
      font-size: 24px;
    }

    .nx-empty-state .nx-empty-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .nx-empty-state .nx-empty-copy {
      font-size: 12.5px;
      line-height: 1.55;
      max-width: 340px;
    }

    /* UX phase: keyboard-shortcuts help rows (Settings). */
    .nx-shortcut-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface, #221e33);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 0 8px 8px 0;
      font-size: 12.5px;
    }

    .nx-shortcut-label {
      color: var(--text-main);
    }

    .nx-kbd {
      background: var(--bg-deep, #12101b);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 5px;
      /* Market audit bug #34: the chip was cramped (1px vertical padding). */
      padding: 3px 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--nx-accent-bright, #FF4D73);
      white-space: nowrap;
    }

    /* UX phase: proper centred confirm modal for destructive actions. */
    .nx-webui-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 10, 0.62);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      animation: nxWebuiFadeIn 180ms ease;
    }

    @keyframes nxWebuiFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .nx-webui-modal {
      width: min(420px, calc(100vw - 48px));
      background: var(--bg-chrome, #181524);
      /* Market audit bug #26: confirm modal uses the red brand accent,
         not the violet theme accent. */
      border: 1px solid var(--nx-brand, #FA1E4E);
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      padding: 20px 22px 18px;
      animation: nxWebuiModalIn 180ms ease;
    }

    /* Market audit bug #26: the modal's confirm action is red-brand too. */
    .nx-webui-modal .btn.primary {
      background: var(--nx-brand, #FA1E4E);
      border-color: var(--nx-brand-bright, #FF4D73);
    }

    .nx-webui-modal .btn.primary:hover:not(:disabled) {
      background: var(--nx-brand-bright, #FF4D73);
    }

    @keyframes nxWebuiModalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .nx-webui-modal-body {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.55;
      margin: 8px 0 4px;
    }

    .nx-webui-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    /* Bookmarks Manager: Favicons, Inline Edit, Folders */
    .bm-favicon-wrap {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bm-favicon-img {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      object-fit: contain;
      display: block;
    }

    .bm-favicon-img.hidden,
    .bm-fallback-svg.hidden {
      display: none !important;
    }

    .bm-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .bm-folder-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .bm-folder-rename-form {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }

    .card-row.bm-editing {
      display: block;
      background: var(--nx-glass-subtle);
    }

    .bm-edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .bm-edit-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr 0.9fr;
      gap: 10px;
    }

    @media (max-width: 720px) {
      .bm-edit-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Market audit A4: split view at 1280px gives each internal page only
       ~640px, and the 240px nav + 360px-min extension cards clipped the
       right pane ("+ Load Unpacke…"). Below 720px the nav collapses to
       icons, grids stack to one column, and headers wrap. (900px rule
       first so the narrower 720px rule wins below 720px.) */
    @media (max-width: 900px) {
      .webui-nav {
        width: 180px;
        min-width: 180px;
      }
      .ext-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    @media (max-width: 720px) {
      .webui-nav {
        width: 56px;
        min-width: 56px;
        padding: 12px 6px;
      }
      .nav-link {
        font-size: 0;
        justify-content: center;
        padding: 0;
        gap: 0;
      }
      .nav-link svg {
        flex-shrink: 0;
      }
      .webui-main {
        padding: 16px 12px;
      }
      .ext-grid {
        grid-template-columns: 1fr;
      }
      .card-header,
      .card-row {
        flex-wrap: wrap;
      }
      .webui-search {
        min-width: 0;
      }
    }

    .bm-edit-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .bm-field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bm-edit-field .input-box {
      width: 100%;
      padding: 7px 10px;
      font-size: 12.5px;
    }

    .bm-edit-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .bm-form-error {
      font-size: 12px;
      color: var(--danger);
      font-weight: 500;
    }

    .bm-folder-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-bright);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: var(--nx-radius-xs);
      flex-shrink: 0;
    }

    /* Profiles & Import/Export (Settings, Bookmarks, Passwords) */
    [data-profile-color="gx-violet"] { --profile-color: var(--nx-swatch-violet); }
    [data-profile-color="crimson"] { --profile-color: var(--nx-swatch-crimson); }
    [data-profile-color="cyan"] { --profile-color: var(--nx-swatch-cyan); }
    [data-profile-color="emerald"] { --profile-color: var(--nx-swatch-emerald); }
    [data-profile-color="magenta"] { --profile-color: var(--nx-swatch-magenta); }
    [data-profile-color="amber"] { --profile-color: var(--nx-swatch-amber); }
    [data-profile-color="lime"] { --profile-color: var(--nx-swatch-lime); }
    [data-profile-color="ice"] { --profile-color: var(--nx-swatch-ice); }

    .prof-webui-avatar {
      width: 34px;
      height: 34px;
      border-radius: var(--nx-radius-pill);
      border: 2px solid var(--profile-color, var(--accent));
      background: color-mix(in srgb, var(--profile-color, var(--accent)) 24%, var(--bg-input));
      color: var(--text-primary);
      font-family: var(--nx-font-display);
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 10px color-mix(in srgb, var(--profile-color, var(--accent)) 28%, transparent);
    }

    .prof-webui-badges {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .prof-webui-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: var(--nx-radius-xs);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-secondary);
    }

    .prof-webui-badge.active {
      border-color: var(--success);
      color: var(--success);
    }

    .prof-webui-badge.current-win {
      border-color: var(--accent);
      color: var(--accent-bright);
      background: var(--accent-soft);
    }

    .prof-webui-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .prof-webui-form-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .prof-webui-swatches {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .prof-webui-swatch {
      width: 22px;
      height: 22px;
      border-radius: var(--nx-radius-pill);
      border: 2px solid transparent;
      background: var(--profile-color, var(--accent));
      cursor: pointer;
      transition: transform var(--nx-motion-fast) var(--nx-motion-ease), border-color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .prof-webui-swatch:hover {
      transform: scale(1.1);
    }

    .prof-webui-swatch.active {
      border-color: var(--nx-white);
      box-shadow: 0 0 8px var(--profile-color, var(--accent));
    }

    .prof-webui-confirm {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--nx-radius-md);
      background: color-mix(in srgb, var(--danger) 10%, var(--bg-input));
      border: 1px solid var(--danger);
    }

    .prof-webui-confirm-copy {
      font-size: 12.5px;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .io-actions-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .pw-warning-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn.danger-solid {
      background: var(--danger);
      border-color: var(--danger);
      color: var(--nx-white);
      font-weight: 700;
    }

    .btn.danger-solid:hover {
      background: color-mix(in srgb, var(--danger) 85%, var(--nx-white));
      border-color: var(--danger);
      color: var(--nx-white);
      box-shadow: none;
    }

    /* Privacy & Security Dashboard */
    .priv-profile-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px 20px;
      margin-bottom: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--nx-radius-lg);
      box-shadow: var(--specular), var(--nx-shadow-md);
    }

    .priv-profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .priv-profile-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .priv-profile-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .priv-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .priv-kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 2px solid var(--border);
      border-radius: var(--nx-radius-lg);
      padding: 16px 18px;
      box-shadow: var(--specular), var(--nx-shadow-md);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .priv-kpi-card.accent {
      border-top-color: var(--accent);
      background: linear-gradient(155deg, var(--accent-soft), var(--bg-card) 62%);
      box-shadow: var(--specular), var(--nx-glow-sm);
    }

    .priv-kpi-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    .priv-kpi-value {
      font-family: var(--nx-font-mono);
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .priv-kpi-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    .priv-kpi-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 2px;
    }

    .priv-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: var(--nx-radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .priv-status-pill.on {
      border-color: var(--success);
      color: var(--success);
      background: color-mix(in srgb, var(--success) 12%, var(--bg-input));
    }

    .priv-status-pill.warn {
      border-color: var(--warning);
      color: var(--warning);
      background: color-mix(in srgb, var(--warning) 12%, var(--bg-input));
    }

    .priv-status-pill.danger {
      border-color: var(--danger);
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 12%, var(--bg-input));
    }

    .priv-status-pill.accent {
      border-color: var(--accent);
      color: var(--accent-bright);
      background: var(--accent-soft);
    }

    .priv-site-count {
      font-family: var(--nx-font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: var(--nx-radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--accent-bright);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .priv-perm-row {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .priv-perm-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .priv-perm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 8px;
    }

    .priv-perm-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: var(--nx-radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-primary);
    }

    .priv-perm-chip.is-allow {
      border-color: color-mix(in srgb, var(--success) 55%, var(--border));
    }

    .priv-perm-chip.is-block {
      border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
    }

    .priv-perm-select {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--nx-radius-xs);
      padding: 3px 7px;
      font-size: 11.5px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .priv-perm-select:focus {
      border-color: var(--accent);
      box-shadow: var(--nx-glow-sm);
    }

    .priv-checklist-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .priv-recent-row {
      padding: 9px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .priv-recent-row:last-child {
      border-bottom: none;
    }

    .priv-recent-host {
      font-family: var(--nx-font-mono);
      color: var(--text-primary);
      word-break: break-all;
    }

    .priv-recent-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      flex-shrink: 0;
      font-size: 11px;
    }

    .settings-highlight-flash {
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent-bright);
    }

    /* Password Manager Polish & Generator */
    .pw-gen-body {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pw-gen-output-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pw-gen-output {
      flex: 1;
      min-width: 220px;
      font-family: var(--nx-font-mono);
      font-size: 13.5px;
      letter-spacing: 0.03em;
    }

    .pw-gen-length-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pw-gen-length-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 56px;
    }

    .pw-gen-length-num {
      width: 68px;
      text-align: center;
      font-family: var(--nx-font-mono);
      padding: 5px 8px;
    }

    .pw-gen-charsets {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pw-charset-opt {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: var(--nx-radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
      transition: border-color var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .pw-charset-opt:hover {
      border-color: var(--accent);
    }

    .pw-charset-opt input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .pw-gen-feedback {
      font-size: 12px;
      color: var(--success);
      font-weight: 500;
    }

    .pw-field-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 170px;
    }

    .pw-field-wrap .input-box {
      flex: 1;
      min-width: 0;
    }

    .pw-row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .pw-masked-input {
      width: 165px;
      font-family: var(--nx-font-mono);
      font-size: 12.5px;
    }
  </style>
</head>
