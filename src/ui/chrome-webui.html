<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nextGx System Settings & Manager</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image:
        linear-gradient(var(--nx-grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--nx-grid-line) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, var(--nx-accent-soft), transparent 45%);
      background-size: 48px 48px, 48px 48px, 100% 100%;
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--nx-font-sans);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* Smooth Pill Toggle Switch */
    .nx-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 23px;
      flex-shrink: 0;
    }

    .nx-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .nx-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--nx-glass-strong);
      border: 1px solid var(--border);
      border-radius: var(--nx-radius-pill);
      transition: background-color 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.22s, box-shadow 0.22s;
    }

    .nx-slider::before {
      position: absolute;
      content: "";
      height: 17px;
      width: 17px;
      left: 2px;
      bottom: 2px;
      background-color: var(--nx-white);
      border-radius: 50%;
      box-shadow: var(--nx-shadow-sm);
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nx-switch input:checked + .nx-slider {
      background-color: var(--accent);
      border-color: var(--accent-bright);
      box-shadow: var(--nx-glow-sm);
    }

    .nx-switch input:checked + .nx-slider::before {
      transform: translateX(17px);
    }

    .nx-switch input:disabled + .nx-slider {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Segmented Pill Control */
    .nx-segmented {
      display: inline-flex;
      background: var(--bg-input);
      padding: 3px;
      border-radius: var(--nx-radius-md);
      border: 1px solid var(--border);
      gap: 3px;
    }

    .seg-btn {
      padding: 5px 12px;
      border-radius: var(--nx-radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.16s;
    }

    .seg-btn:hover {
      color: var(--text-primary);
    }

    .seg-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-bright);
      box-shadow: var(--specular), var(--nx-glow-sm);
    }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .theme-dot.gx-violet { background: var(--nx-swatch-violet); }
    .theme-dot.crimson { background: var(--nx-swatch-crimson); }
    .theme-dot.cyan { background: var(--nx-swatch-cyan); }
    .theme-dot.emerald { background: var(--nx-swatch-emerald); }

    /* Header Bar */
    .webui-topbar {
      height: 60px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--nx-accent-soft);
      box-shadow: inset 0 -1px 0 var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .webui-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 600;
    }

    .webui-brand span.badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
      color: var(--nx-on-accent);
      font-family: var(--nx-font-display);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: var(--nx-radius-xs);
      clip-path: var(--nx-chamfer-sm);
      box-shadow: var(--nx-glow-sm);
    }

    #pageHeaderTitle {
      font-size: 16px;
      color: var(--text-primary);
    }

    .webui-search {
      width: 440px;
      max-width: 48vw;
      height: 36px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--nx-radius-md);
      clip-path: var(--nx-chamfer-sm);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      transition: border-color 0.16s, box-shadow 0.16s;
    }

    .webui-search svg {
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .webui-search:focus-within {
      border-color: var(--accent);
      box-shadow: var(--nx-glow-md), inset 0 0 8px var(--nx-accent-soft);
    }

    .webui-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
    }

    .webui-right-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .webui-layout {
      flex: 1;
      display: flex;
    }

    .webui-nav {
      width: 240px;
      min-width: 240px;
      background: var(--bg-sidebar);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-right: 1px solid var(--border);
    }

    .nav-link {
      height: 38px;
      padding: 0 14px;
      border-radius: var(--nx-radius-md);
      clip-path: var(--nx-chamfer-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
    }

    .nav-link:hover {
      background: var(--nx-glass-subtle);
      border-color: var(--nx-accent-soft);
      color: var(--text-primary);
    }

    .nav-link.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: var(--specular), var(--nx-glow-sm), inset 3px 0 0 var(--accent-bright);
      color: var(--text-primary);
      font-weight: 600;
    }

    .webui-main {
      flex: 1;
      padding: 28px 40px;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      box-shadow: var(--specular), var(--nx-shadow-lg);
      border-radius: var(--nx-radius-lg);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header h2 {
      font-size: 13.5px;
      color: var(--accent-bright);
    }

    .card-row {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 13.5px;
      transition: background 0.14s;
    }

    .card-row:hover {
      background: var(--nx-glass-subtle);
    }

    .card-row:last-child {
      border-bottom: none;
    }

    .row-info {
      flex: 1;
      overflow: hidden;
    }

    .row-title {
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .row-title:hover {
      color: var(--accent-bright);
    }

    .row-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .progress-track {
      height: 6px;
      background: var(--bg-input);
      border-radius: var(--nx-radius-pill);
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      box-shadow: var(--nx-glow-sm);
      transition: width 0.25s;
    }

    .btn {
      padding: 7px 14px;
      border-radius: var(--nx-radius-sm);
      clip-path: var(--nx-chamfer-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      box-shadow: var(--specular);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn:hover {
      border-color: var(--accent-bright);
      color: var(--accent-bright);
      box-shadow: var(--nx-glow-sm);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: var(--nx-on-accent);
      box-shadow: var(--nx-glow-sm);
      font-weight: 700;
    }

    .btn.primary:hover {
      background: var(--accent-bright);
      color: var(--nx-on-accent);
      box-shadow: var(--nx-glow-md);
    }

    .btn.danger:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: var(--nx-white);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .settings-homepage-form {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .settings-homepage-input {
      width: 280px;
      max-width: 100%;
    }

    .settings-form-msg {
      font-size: 12px;
      margin-top: 5px;
      font-weight: 500;
    }

    .settings-form-msg.error {
      color: var(--danger);
    }

    .settings-form-msg.success {
      color: var(--success);
    }

    .input-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: var(--nx-radius-md);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-box:focus {
      border-color: var(--accent);
      box-shadow: var(--nx-glow-sm);
    }

    .ext-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .ext-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      box-shadow: var(--specular), var(--nx-shadow-md);
      border-radius: var(--nx-radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.16s, box-shadow 0.16s;
    }

    .ext-card:hover {
      border-color: var(--accent);
      box-shadow: var(--specular), var(--nx-glow-sm);
    }

    .ext-card.disabled {
      border-top-color: var(--border);
      opacity: 0.78;
    }

    .ext-card.disabled .ext-icon {
      background: var(--bg-input);
      border-color: var(--border);
      color: var(--text-secondary);
      box-shadow: none;
    }

    .ext-banner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      border-radius: var(--nx-radius-lg);
      border: 1px solid var(--border);
      background: var(--bg-card);
      box-shadow: var(--specular), var(--nx-shadow-md);
      margin-bottom: 18px;
      font-size: 13px;
    }

    .ext-banner.error {
      border-color: var(--danger);
      border-left: 3px solid var(--danger);
    }

    .ext-banner.warning {
      border-color: var(--warning);
      border-left: 3px solid var(--warning);
    }

    .ext-banner.success {
      border-color: var(--success);
      border-left: 3px solid var(--success);
    }

    .ext-banner.info {
      border-color: var(--accent);
      border-left: 3px solid var(--accent);
    }

    .ext-banner-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .ext-banner.error .ext-banner-title { color: var(--danger); }
    .ext-banner.warning .ext-banner-title { color: var(--warning); }
    .ext-banner.success .ext-banner-title { color: var(--success); }
    .ext-banner.info .ext-banner-title { color: var(--accent-bright); }

    .ext-banner-detail {
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.45;
      word-break: break-word;
    }

    .ext-banner-list {
      margin-top: 6px;
      padding-left: 18px;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.45;
    }

    .ext-meta-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    .ext-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--nx-radius-xs);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-secondary);
    }

    .ext-pill.active {
      border-color: var(--success);
      color: var(--success);
    }

    .ext-pill.mv {
      border-color: var(--accent);
      color: var(--accent-bright);
    }

    .ext-dev-meta {
      margin-top: 8px;
      font-size: 11.5px;
      color: var(--text-secondary);
      word-break: break-all;
      line-height: 1.45;
    }

    .ext-note {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: var(--nx-radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border);
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .ext-note.warning {
      border-color: var(--warning);
      color: var(--warning);
    }

    .ext-note.error {
      border-color: var(--danger);
      color: var(--danger);
    }

    .ext-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ext-top {
      display: flex;
      gap: 14px;
    }

    .ext-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--nx-radius-md);
      clip-path: var(--nx-chamfer-sm);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent-bright);
      box-shadow: var(--nx-glow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .ext-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    /* Bookmarks Manager: Favicons, Inline Edit, Folders */
    .bm-favicon-wrap {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bm-favicon-img {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      object-fit: contain;
      display: block;
    }

    .bm-favicon-img.hidden,
    .bm-fallback-svg.hidden {
      display: none !important;
    }

    .bm-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .bm-folder-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .bm-folder-rename-form {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }

    .card-row.bm-editing {
      display: block;
      background: var(--nx-glass-subtle);
    }

    .bm-edit-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .bm-edit-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr 0.9fr;
      gap: 10px;
    }

    @media (max-width: 720px) {
      .bm-edit-grid {
        grid-template-columns: 1fr;
      }
    }

    .bm-edit-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .bm-field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bm-edit-field .input-box {
      width: 100%;
      padding: 7px 10px;
      font-size: 12.5px;
    }

    .bm-edit-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .bm-form-error {
      font-size: 12px;
      color: var(--danger);
      font-weight: 500;
    }

    .bm-folder-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-bright);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: var(--nx-radius-xs);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header class="webui-topbar">
    <div class="webui-brand">
      <span class="badge">nextGx</span>
      <span class="nx-heading" id="pageHeaderTitle">History</span>
    </div>

    <div class="webui-search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="globalSearchInput" placeholder="Search..." />
    </div>

    <div class="webui-right-actions" id="topRightActions"></div>
  </header>

  <div class="webui-layout">
    <aside class="webui-nav">
      <button class="nav-link" data-page="history">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        History
      </button>
      <button class="nav-link" data-page="downloads">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Downloads
      </button>
      <button class="nav-link" data-page="bookmarks">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Bookmarks
      </button>
      <button class="nav-link" data-page="passwords">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Passwords & Autofill
      </button>
      <button class="nav-link" data-page="extensions">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.5 0 2.7 1.2 2.7 2.7S5 16.2 3.5 16.2H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.5 1.2-2.7 2.7-2.7s2.7 1.2 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
        Extensions
