<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Popover</title>
  <style>
    :root {
      --bg: #1b182a;
      --bg-card: #242038;
      --bg-input: #13101d;
      --accent: #9d4edd;
      --accent-bright: #c77dff;
      --text: #f3f1f8;
      --muted: #9690ab;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', Ubuntu, sans-serif;
      border: 1px solid var(--accent);
      border-radius: 10px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hidden { display: none !important; }

    /* Pill Toggle Switch */
    .nx-switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 19px;
      flex-shrink: 0;
    }
    .nx-switch input { opacity: 0; width: 0; height: 0; }
    .nx-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255,255,255,0.14);
      border-radius: 999px;
      transition: 0.2s;
    }
    .nx-slider::before {
      position: absolute;
      content: "";
      height: 13px;
      width: 13px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .nx-switch input:checked + .nx-slider {
      background: var(--accent);
    }
    .nx-switch input:checked + .nx-slider::before {
      transform: translateX(15px);
    }

    /* Menu Items */
    .menu-item {
      height: 31px;
      padding: 0 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .menu-item:hover {
      background: var(--bg-card);
    }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .menu-item kbd {
      font-size: 10.5px;
      color: var(--muted);
      font-family: inherit;
    }

    .sep {
      height: 1px;
      background: var(--border);
      margin: 4px 2px;
    }

    .zoom-row {
      height: 32px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .zbtn {
      width: 24px;
      height: 22px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      cursor: pointer;
    }

    .zbtn:hover { border-color: var(--accent); }

    /* Site Security & Permissions */
    .sec-header {
      padding: 8px 10px;
      background: var(--bg-card);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sec-status { font-size: 13px; font-weight: 700; }
    .sec-origin { font-size: 11px; color: var(--muted); word-break: break-all; }

    .perm-row {
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .perm-select {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 11px;
      outline: none;
    }

    .dl-mini-card {
      padding: 8px 10px;
      border-radius: 7px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .dl-mini-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .dl-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .mini-btn {
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <!-- 1. FLOATING 3-DOT MENU -->
  <div id="view-menu" class="hidden">
    <button class="menu-item" data-act="new-tab">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New Tab
      </span>
      <kbd>Ctrl+T</kbd>
    </button>
    <button class="menu-item" data-act="new-window">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        New Window
      </span>
      <kbd>Ctrl+N</kbd>
    </button>
    <button class="menu-item" data-act="new-incognito">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M5 12l2-5h10l2 5"/><circle cx="8" cy="16" r="2.5"/><circle cx="16" cy="16" r="2.5"/></svg>
        New Private Tab
      </span>
      <kbd>Ctrl+Shift+N</kbd>
    </button>

    <div class="sep"></div>

    <button class="menu-item" data-act="history">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        History
      </span>
      <kbd>Ctrl+H</kbd>
    </button>
    <button class="menu-item" data-act="downloads">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Downloads
      </span>
      <kbd>Ctrl+J</kbd>
    </button>
    <button class="menu-item" data-act="bookmarks">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Bookmarks Manager
      </span>
      <kbd>Ctrl+D</kbd>
    </button>
    <button class="menu-item" data-act="passwords">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Passwords & Autofill
      </span>
      <span></span>
    </button>
    <button class="menu-item" data-act="extensions">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.5 0 2.7 1.2 2.7 2.7S5 16.2 3.5 16.2H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.5 1.2-2.7 2.7-2.7s2.7 1.2 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
        Extensions
      </span>
      <span></span>
    </button>

    <div class="sep"></div>

    <div class="zoom-row">
      <span>Zoom</span>
      <div class="zoom-controls">
        <button class="zbtn" id="btnZoomOut">−</button>
        <span id="zoomPct">100%</span>
        <button class="zbtn" id="btnZoomIn">+</button>
        <button class="zbtn" id="btnFs" title="Fullscreen">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>

    <button class="menu-item" data-act="screenshot-area">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Capture Area Screenshot
      </span>
      <span></span>
    </button>
    <button class="menu-item" data-act="print">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print...
      </span>
      <kbd>Ctrl+P</kbd>
    </button>
    <button class="menu-item" data-act="find">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Find in page...
      </span>
      <kbd>Ctrl+F</kbd>
    </button>
    <button class="menu-item" data-act="devtools">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Developer Tools
      </span>
      <kbd>F12</kbd>
    </button>

    <div class="sep"></div>

    <button class="menu-item" data-act="settings">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </span>
      <span></span>
    </button>
    <button class="menu-item" data-act="exit">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Exit nextGx
      </span>
      <span></span>
    </button>
  </div>

  <!-- 2. LOCK / SITE SECURITY & PERMISSIONS POPOVER -->
  <div id="view-permissions" class="hidden" style="display:flex;flex-direction:column;gap:8px;">
    <div class="sec-header">
      <svg id="secIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#10b981" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <div>
        <div class="sec-status" id="secStatusText">Connection is secure</div>
        <div class="sec-origin" id="secOriginText">https://example.com</div>
      </div>
    </div>

    <div style="font-size:11.5px;color:var(--muted);padding:0 4px;">Site Permissions</div>

    <div class="perm-row">
      <span>Camera</span>
      <select class="perm-select" data-perm="camera">
        <option value="ask">Ask</option>
        <option value="allow">Allow</option>
        <option value="block">Block</option>
      </select>
    </div>
    <div class="perm-row">
      <span>Microphone</span>
      <select class="perm-select" data-perm="microphone">
        <option value="ask">Ask</option>
        <option value="allow">Allow</option>
        <option value="block">Block</option>
      </select>
    </div>
    <div class="perm-row">
      <span>Location</span>
      <select class="perm-select" data-perm="geolocation">
        <option value="ask">Ask</option>
        <option value="allow">Allow</option>
        <option value="block">Block</option>
      </select>
    </div>
    <div class="perm-row">
      <span>Notifications</span>
      <select class="perm-select" data-perm="notifications">
        <option value="ask">Ask</option>
        <option value="allow">Allow</option>
        <option value="block">Block</option>
      </select>
    </div>
  </div>

  <!-- 3. SCREENSHOT MODE POPOVER -->
  <div id="view-screenshot" class="hidden" style="display:flex;flex-direction:column;gap:6px;">
    <button class="menu-item" id="btnShotArea">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v4M6 18v4M2 6h4M18 6h4M6 6h12v12H6z"/></svg>
        Capture Selected Area
      </span>
    </button>
    <button class="menu-item" id="btnShotFull">
      <span class="menu-left">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
        Capture Full View
      </span>
    </button>
  </div>

  <!-- 4. QUICK DOWNLOADS POPOVER -->
  <div id="view-downloads" class="hidden" style="display:flex;flex-direction:column;gap:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 4px;">
      <strong style="font-size:13px;">Recent Downloads</strong>
      <button class="mini-btn" id="btnOpenDlPage">Full Manager</button>
    </div>
    <div id="popDlList" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>

  <script>
    let currentOrigin = '';

    function showOnly(viewId) {
      ['view-menu', 'view-permissions', 'view-screenshot', 'view-downloads'].forEach((id) => {
        document.getElementById(id).classList.toggle('hidden', id !== viewId);
      });
    }

    window.gxAPI.onPopoverData(async (data) => {
      if (!data || data.closed) return;
      const { kind, payload } = data;

      if (kind === 'menu') {
        showOnly('view-menu');
        document.getElementById('zoomPct').textContent = `${payload?.zoomPercent || 100}%`;
      } else if (kind === 'permissions') {
        showOnly('view-permissions');
        currentOrigin = payload?.origin || '';
        const isSecure = Boolean(payload?.isSecure);
        const isHttp = Boolean(payload?.isHttpInsecure);
        document.getElementById('secOriginText').textContent = payload?.url || currentOrigin || 'Internal Page';
        document.getElementById('secStatusText').textContent = isHttp
          ? 'Not Secure (HTTP)'
          : isSecure
          ? 'Connection is secure'
          : 'nextGx Internal Page';
        document.getElementById('secIcon').setAttribute('stroke', isHttp ? '#f59e0b' : '#10b981');

        if (currentOrigin) {
          const perms = await window.gxAPI.getSitePermissions(currentOrigin);
          document.querySelectorAll('[data-perm]').forEach((sel) => {
            sel.disabled = false;
            sel.value = perms[sel.dataset.perm] || 'ask';
          });
        } else {
          document.querySelectorAll('[data-perm]').forEach((sel) => {
            sel.disabled = true;
          });
        }
      } else if (kind === 'screenshot') {
        showOnly('view-screenshot');
      } else if (kind === 'downloads') {
        showOnly('view-downloads');
        const list = await window.gxAPI.getDownloads();
        renderMiniDownloads(list);
      }
    });

    document.querySelectorAll('[data-act]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.act;
        if (act === 'screenshot-area') {
          window.gxAPI.startAreaScreenshot();
        } else {
          window.gxAPI.triggerMenuAction(act);
        }
      });
    });

    document.getElementById('btnZoomIn').addEventListener('click', async () => {
      const pct = await window.gxAPI.setZoom('in');
      document.getElementById('zoomPct').textContent = `${pct}%`;
    });
    document.getElementById('btnZoomOut').addEventListener('click', async () => {
      const pct = await window.gxAPI.setZoom('out');
      document.getElementById('zoomPct').textContent = `${pct}%`;
    });
    document.getElementById('btnFs').addEventListener('click', () => {
      window.gxAPI.closePopover();
      window.gxAPI.toggleFullscreen();
    });

    document.querySelectorAll('[data-perm]').forEach((sel) => {
      sel.addEventListener('change', async () => {
        if (currentOrigin) {
          await window.gxAPI.setSitePermission(currentOrigin, sel.dataset.perm, sel.value);
        }
      });
    });

    document.getElementById('btnShotArea').addEventListener('click', () => window.gxAPI.startAreaScreenshot());
    document.getElementById('btnShotFull').addEventListener('click', () => window.gxAPI.captureScreenshot());

    document.getElementById('btnOpenDlPage').addEventListener('click', () => {
      window.gxAPI.triggerMenuAction('downloads');
    });

    function renderMiniDownloads(list) {
      const el = document.getElementById('popDlList');
      el.innerHTML = '';
      const recent = (list || []).slice(0, 6);
      if (!recent.length) {
        el.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:10px 4px;">No recent downloads.</div>';
        return;
      }
      for (const d of recent) {
        const pct = d.totalBytes > 0 ? Math.min(100, Math.round((d.receivedBytes / d.totalBytes) * 100)) : 100;
        const card = document.createElement('div');
        card.className = 'dl-mini-card';
        card.innerHTML = `
          <div class="dl-mini-top">
            <span class="dl-name">${d.filename}</span>
            <button class="mini-btn open-btn">Open</button>
          </div>
          <div style="font-size:10.5px;color:var(--muted);">${d.state} (${pct}%)</div>
        `;
        card.querySelector('.open-btn').addEventListener('click', () => {
          window.gxAPI.openDownloadItem(d.savePath);
        });
        el.appendChild(card);
      }
    }

    window.gxAPI.onDownloadsUpdate((list) => {
      if (!document.getElementById('view-downloads').classList.contains('hidden')) {
        renderMiniDownloads(list);
      }
    });
  </script>
</body>
</html>
