<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <title>nextGx Passkey</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #12101b;
      color: #f2eefc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 26px 22px;
      -webkit-user-select: none;
      user-select: none;
    }

    .key-art {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2140, #1a1426);
      border: 1px solid rgba(157, 78, 221, 0.55);
      box-shadow: 0 0 28px rgba(157, 78, 221, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 19px;
      font-weight: 650;
      margin: 0 0 6px;
      text-align: center;
      line-height: 1.35;
    }

    h1 .site {
      color: #c77dff;
      overflow-wrap: anywhere;
    }

    .sub {
      font-size: 13.5px;
      color: #b9b3cc;
      text-align: center;
      line-height: 1.5;
      margin: 0 0 4px;
      max-width: 380px;
    }

    .origin {
      font-size: 12px;
      color: #8d86a3;
      text-align: center;
      margin: 0 0 18px;
      overflow-wrap: anywhere;
    }

    .user-line {
      font-size: 13.5px;
      color: #e8e2f5;
      text-align: center;
      margin: 0 0 18px;
    }

    .user-line strong {
      color: #ffffff;
    }

    .candidates {
      width: 100%;
      max-width: 380px;
      margin: 0 0 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .candidate {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: #1d1830;
      border: 1px solid #3a2f5c;
      border-radius: 10px;
      padding: 10px 12px;
      color: #f2eefc;
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
    }

    .candidate:hover {
      border-color: #9d4edd;
    }

    .candidate.selected {
      border-color: #c77dff;
      background: #2a2140;
      box-shadow: 0 0 0 1px #c77dff;
    }

    .candidate .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex: 0 0 30px;
      background: linear-gradient(145deg, #9d4edd, #fa1e4e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }

    .candidate .who {
      overflow: hidden;
    }

    .candidate .who .name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .candidate .who .meta {
      font-size: 11.5px;
      color: #b9b3cc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note {
      font-size: 12px;
      color: #8d86a3;
      text-align: center;
      line-height: 1.5;
      margin: 0 0 20px;
      max-width: 380px;
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    button {
      flex: 1;
      padding: 11px 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid #3a2f5c;
      cursor: pointer;
      background: #241d38;
      color: #f2eefc;
    }

    button:hover {
      border-color: #9d4edd;
    }

    button.primary {
      background: linear-gradient(135deg, #9d4edd, #fa1e4e);
      border: none;
      color: #fff;
    }

    button.primary:hover {
      filter: brightness(1.12);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .error {
      color: #ff8fa3;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="key-art" aria-hidden="true">&#128272;</div>
  <h1 id="title">Use your passkey</h1>
  <p class="sub" id="subtitle">Confirm to continue with this site.</p>
  <p class="origin" id="origin"></p>
  <div class="user-line" id="userLine" hidden></div>
  <div class="candidates" id="candidates" hidden></div>
  <p class="note" id="note"></p>
  <div class="actions">
    <button type="button" id="btnCancel">Cancel</button>
    <button type="button" class="primary" id="btnContinue">Continue</button>
  </div>
  <p class="error" id="error" hidden></p>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const dialogId = params.get('dialog') || '';
      const $ = (id) => document.getElementById(id);
      const titleEl = $('title'), subtitleEl = $('subtitle'), originEl = $('origin'),
        userLineEl = $('userLine'), candidatesEl = $('candidates'), noteEl = $('note'),
        errorEl = $('error'), btnContinue = $('btnContinue'), btnCancel = $('btnCancel');
      let selectedCredentialId = null;
      let request = null;

      function fail(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
        btnContinue.disabled = true;
      }
      function submit(action) {
        try {
          window.gxPasskeyDialogAPI.submit({ dialogId, action, selectedCredentialId });
        } catch (_) { }
        // The main process closes this window; if it does not, close via cancel.
        if (action === 'cancel') window.close();
      }
      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      btnCancel.addEventListener('click', () => submit('cancel'));
      btnContinue.addEventListener('click', () => submit('confirm'));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') submit('cancel');
        if (e.key === 'Enter') {
          if (btnContinue.disabled) return;
          const active = document.activeElement;
          if (active === btnCancel || (active && active.classList && active.classList.contains('cand'))) {
            return;
          }
          submit('confirm');
        }
      });

      if (!window.gxPasskeyDialogAPI || !dialogId) {
        fail('This dialog could not be opened. Please try again.');
        return;
      }
      window.gxPasskeyDialogAPI.getRequest(dialogId).then((req) => {
        request = req;
        if (!req || typeof req !== 'object') {
          fail('This passkey request is no longer available.');
          return;
        }
        const site = req.rpName || req.rpId || req.origin || 'this site';
        if (req.mode === 'create') {
          titleEl.innerHTML = 'Create a passkey for <span class="site">' + escapeHtml(site) + '</span>';
          subtitleEl.textContent = 'nextGx will save a passkey on this device so you can sign in without a password.';
          if (req.username) {
            userLineEl.innerHTML = 'Signing in as <strong>' + escapeHtml(req.username) + '</strong>';
            userLineEl.hidden = false;
          }
          noteEl.textContent = 'Your passkey stays on this device. Confirming here is the "touch" that proves you are present — no PIN or fingerprint is checked.';
        } else {
          titleEl.innerHTML = 'Use your passkey with <span class="site">' + escapeHtml(site) + '</span>';
          subtitleEl.textContent = 'Choose a passkey to sign in.';
          const list = Array.isArray(req.candidates) ? req.candidates : [];
          if (list.length > 1) {
            candidatesEl.hidden = false;
            list.forEach((c, i) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'candidate' + (i === 0 ? ' selected' : '');
              const initial = (c.username || c.displayName || '?').trim().charAt(0).toUpperCase() || '?';
              const when = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : '';
              btn.innerHTML = '<span class="avatar">' + escapeHtml(initial) + '</span>' +
                '<span class="who"><span class="name">' + escapeHtml(c.displayName || c.username || 'Passkey') + '</span><br/>' +
                '<span class="meta">' + escapeHtml(c.username || '') + (when ? ' · created ' + escapeHtml(when) : '') + '</span></span>';
              btn.addEventListener('click', () => {
                selectedCredentialId = c.id;
                candidatesEl.querySelectorAll('.candidate').forEach((el) => el.classList.remove('selected'));
                btn.classList.add('selected');
              });
              candidatesEl.appendChild(btn);
            });
            selectedCredentialId = list[0].id;
          } else if (list.length === 1) {
            selectedCredentialId = list[0].id;
            userLineEl.innerHTML = 'Signing in as <strong>' + escapeHtml(list[0].username || list[0].displayName || '') + '</strong>';
            userLineEl.hidden = false;
          }
          noteEl.textContent = 'Confirming here is the "touch" that proves you are present — no PIN or fingerprint is checked.';
        }
        originEl.textContent = req.origin || '';
      }).catch(() => fail('This passkey request could not be loaded.'));
    })();
  </script>
</body>

</html>
