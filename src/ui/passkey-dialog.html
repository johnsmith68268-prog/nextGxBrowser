<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <title>nextGx Passkey</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #12101b;
      color: #f2eefc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 26px 22px;
      -webkit-user-select: none;
      user-select: none;
    }

    .key-art {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2140, #1a1426);
      border: 1px solid rgba(157, 78, 221, 0.55);
      box-shadow: 0 0 28px rgba(157, 78, 221, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 19px;
      font-weight: 650;
      margin: 0 0 6px;
      text-align: center;
      line-height: 1.35;
    }

    h1 .site {
      color: #c77dff;
      overflow-wrap: anywhere;
    }

    .sub {
      font-size: 13.5px;
      color: #b9b3cc;
      text-align: center;
      line-height: 1.5;
      margin: 0 0 4px;
      max-width: 380px;
    }

    .origin {
      font-size: 12px;
      color: #8d86a3;
      text-align: center;
      margin: 0 0 18px;
      overflow-wrap: anywhere;
    }

    .user-line {
      font-size: 13.5px;
      color: #e8e2f5;
      text-align: center;
      margin: 0 0 18px;
    }

    .user-line strong {
      color: #ffffff;
    }

    .candidates {
      width: 100%;
      max-width: 380px;
      margin: 0 0 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .candidate {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: #1d1830;
      border: 1px solid #3a2f5c;
      border-radius: 10px;
      padding: 10px 12px;
      color: #f2eefc;
      font-size: 13.5px;
      cursor: pointer;
      text-align: left;
    }

    .candidate:hover {
      border-color: #9d4edd;
    }

    .candidate.selected {
      border-color: #c77dff;
      background: #2a2140;
      box-shadow: 0 0 0 1px #c77dff;
    }

    .candidate .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex: 0 0 30px;
      background: linear-gradient(145deg, #9d4edd, #fa1e4e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }

    .candidate .who {
      overflow: hidden;
    }

    .candidate .who .name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .candidate .who .meta {
      font-size: 11.5px;
      color: #b9b3cc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note {
      font-size: 12px;
      color: #8d86a3;
      text-align: center;
      line-height: 1.5;
      margin: 0 0 20px;
      max-width: 380px;
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    button {
      flex: 1;
      padding: 11px 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid #3a2f5c;
      cursor: pointer;
      background: #241d38;
      color: #f2eefc;
    }

    button:hover {
      border-color: #9d4edd;
    }

    button.primary {
      background: linear-gradient(135deg, #9d4edd, #fa1e4e);
      border: none;
      color: #fff;
    }

    button.primary:hover {
      filter: brightness(1.12);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .error {
      color: #ff8fa3;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="key-art" aria-hidden="true">&#128272;</div>
  <h1 id="title">Use your passkey</h1>
  <p class="sub" id="subtitle">Confirm to continue with this site.</p>
  <p class="origin" id="origin"></p>
  <div class="user-line" id="userLine" hidden></div>
  <div class="candidates" id="candidates" hidden></div>
  <p class="note" id="note"></p>
  <div class="actions">
    <button type="button" id="btnCancel">Cancel</button>
    <button type="button" class="primary" id="btnContinue">Continue</button>
  </div>
  <p class="error" id="error" hidden></p>
  <script src="passkey-dialog.js"></script>
</body>

</html>
