<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none';" />
  <title>Snapshot</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--nx-overlay-black);
      position: relative;
      cursor: crosshair;
      font-family: var(--nx-font-sans);
    }

    #bgImgDim,
    #bgImgClear {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      pointer-events: none;
    }

    #bgImgDim {
      filter: brightness(0.45);
      z-index: 1;
    }

    #bgImgClear {
      z-index: 2;
      clip-path: inset(100% 100% 100% 100%);
    }

    /* Opera GX style top floating action bar */
    .snap-topbar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 30;
      cursor: default;
    }

    .snap-pill-btn {
      background: color-mix(in srgb, var(--bg-surface) 94%, transparent);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: var(--nx-radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--nx-shadow-md);
      transition: background var(--nx-motion-fast) var(--nx-motion-ease), border-color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .snap-pill-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--nx-accent);
      color: var(--nx-accent-bright);
      box-shadow: var(--nx-glow-sm);
    }

    /* Initial "Crop to snap" centered dashed prompt */
    .crop-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 120px;
      border: 2px dashed rgba(255, 255, 255, 0.85);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--nx-white);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
      pointer-events: none;
      z-index: 5;
    }

    .crop-prompt.hidden {
      display: none;
    }

    /* Interactive crop selection box with 8 white handles */
    #selectionBox {
      position: fixed;
      border: 1.5px dashed rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 0 1px var(--nx-accent-soft);
      display: none;
      z-index: 10;
      cursor: move;
    }

    .size-badge {
      position: absolute;
      top: -24px;
      left: 0;
      background: color-mix(in srgb, var(--bg-deep) 92%, transparent);
      border: 1px solid var(--nx-accent-soft);
      color: var(--text-main);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      padding: 2px 7px;
      border-radius: var(--nx-radius-xs);
      pointer-events: none;
      white-space: nowrap;
    }

    .handle {
      position: absolute;
      width: 9px;
      height: 9px;
      background: var(--nx-white);
      border: 1.5px solid var(--nx-accent);
      border-radius: 50%;
      z-index: 12;
    }
    .handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
    .handle.n  { top: -5px; left: calc(50% - 4.5px); cursor: ns-resize; }
    .handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .handle.e  { top: calc(50% - 4.5px); right: -5px; cursor: ew-resize; }
    .handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
    .handle.s  { bottom: -5px; left: calc(50% - 4.5px); cursor: ns-resize; }
    .handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .handle.w  { top: calc(50% - 4.5px); left: -5px; cursor: ew-resize; }

    /* Opera GX bottom-right floating action bar */
    .snap-actions {
      position: fixed;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 30;
      cursor: default;
    }

    .snap-act-btn {
      background: color-mix(in srgb, var(--bg-surface) 96%, transparent);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: var(--nx-radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--nx-shadow-md);
      transition: background var(--nx-motion-fast) var(--nx-motion-ease), border-color var(--nx-motion-fast) var(--nx-motion-ease), box-shadow var(--nx-motion-fast) var(--nx-motion-ease);
    }

    .snap-act-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--nx-accent);
    }

    .snap-act-btn.primary {
      background: var(--nx-accent);
      border-color: var(--nx-accent-bright);
      color: var(--nx-on-accent);
      box-shadow: var(--nx-glow-sm);
    }

    .snap-act-btn.primary:hover {
      background: var(--nx-accent-bright);
      box-shadow: var(--nx-glow-md);
    }
  </style>
</head>
<body>
  <div class="snap-topbar" id="snapTopbar">
    <button type="button" class="snap-pill-btn" id="btnCaptureVisible">Capture visible page</button>
    <button type="button" class="snap-pill-btn" id="btnCaptureFull">Capture full page</button>
    <button type="button" class="snap-pill-btn" id="btnSavePdf">Save page as PDF</button>
  </div>

  <img id="bgImgDim" alt="" />
  <img id="bgImgClear" alt="" />

  <div class="crop-prompt" id="cropPrompt">Crop to snap</div>

  <div id="selectionBox">
    <div class="size-badge" id="sizeBadge">0 × 0</div>
    <div class="handle nw" data-handle="nw"></div>
    <div class="handle n" data-handle="n"></div>
    <div class="handle ne" data-handle="ne"></div>
    <div class="handle e" data-handle="e"></div>
    <div class="handle se" data-handle="se"></div>
    <div class="handle s" data-handle="s"></div>
    <div class="handle sw" data-handle="sw"></div>
    <div class="handle w" data-handle="w"></div>
  </div>

  <div class="snap-actions" id="snapActions">
    <button type="button" class="snap-act-btn" id="btnSnapCancel">Cancel</button>
    <button type="button" class="snap-act-btn" id="btnSnapCopy">Copy and close</button>
    <button type="button" class="snap-act-btn primary" id="btnSnapCapture">Capture</button>
  </div>

  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme || 'gx-violet');
    }

    (function initThemeSync() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('incognito') === '1') {
        document.documentElement.setAttribute('data-incognito', 'true');
      }
      const initialTheme = params.get('theme');
      if (initialTheme) applyTheme(initialTheme);
      window.gxAPI?.getSettings?.().then((s) => applyTheme(s?.theme)).catch(() => {});
      window.gxAPI?.onSettingsUpdate?.((s) => {
        if (s && s.theme) applyTheme(s.theme);
      });
    })();

    const bgImgDim = document.getElementById('bgImgDim');
    const bgImgClear = document.getElementById('bgImgClear');
    const cropPrompt = document.getElementById('cropPrompt');
    const box = document.getElementById('selectionBox');
    const sizeBadge = document.getElementById('sizeBadge');
    const snapActions = document.getElementById('snapActions');

    let rect = null; // { x, y, width, height }
    let dragMode = null; // 'create' | 'move' | handle name ('nw','n','ne','e','se','s','sw','w')
    let anchorX = 0;
    let anchorY = 0;
    let startRect = null;

    function resetSelection() {
      rect = null;
      dragMode = null;
      box.style.display = 'none';
      snapActions.style.display = 'none';
      cropPrompt.classList.remove('hidden');
      bgImgClear.style.clipPath = 'inset(100% 100% 100% 100%)';
    }

    function renderRect({ showActions = false } = {}) {
      if (!rect || rect.width < 2 || rect.height < 2) {
        box.style.display = 'none';
        snapActions.style.display = 'none';
        bgImgClear.style.clipPath = 'inset(100% 100% 100% 100%)';
        return;
      }

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const x = Math.max(0, Math.min(vw - 2, Math.round(rect.x)));
      const y = Math.max(0, Math.min(vh - 2, Math.round(rect.y)));
      const w = Math.max(2, Math.min(vw - x, Math.round(rect.width)));
      const h = Math.max(2, Math.min(vh - y, Math.round(rect.height)));

      cropPrompt.classList.add('hidden');
      box.style.display = 'block';
      box.style.left = x + 'px';
      box.style.top = y + 'px';
      box.style.width = w + 'px';
      box.style.height = h + 'px';
      sizeBadge.textContent = `${w} × ${h}`;

      const rightInset = Math.max(0, vw - (x + w));
      const bottomInset = Math.max(0, vh - (y + h));
      bgImgClear.style.clipPath = `inset(${y}px ${rightInset}px ${bottomInset}px ${x}px)`;

      if (showActions && w >= 8 && h >= 8) {
        snapActions.style.display = 'flex';
        const actW = snapActions.offsetWidth || 268;
        const actH = snapActions.offsetHeight || 36;
        const left = Math.max(10, Math.min(vw - actW - 10, x + w - actW));
        const belowY = y + h + 10;
        const top = belowY + actH <= vh - 10 ? belowY : Math.max(58, y - actH - 10);
        snapActions.style.left = Math.round(left) + 'px';
        snapActions.style.top = Math.round(top) + 'px';
      } else {
        snapActions.style.display = 'none';
      }
    }

    function getScaledPayload(mode) {
      if (!rect || rect.width < 4 || rect.height < 4) return null;
      const scaleX = bgImgDim.naturalWidth ? bgImgDim.naturalWidth / window.innerWidth : 1;
      const scaleY = bgImgDim.naturalHeight ? bgImgDim.naturalHeight / window.innerHeight : 1;
      return {
        mode,
        x: rect.x * scaleX,
        y: rect.y * scaleY,
        width: rect.width * scaleX,
        height: rect.height * scaleY
      };
    }

    window.gxAPI.onScreenshotCaptured(({ dataUrl }) => {
      if (dataUrl) {
        bgImgDim.src = dataUrl;
        bgImgClear.src = dataUrl;
        resetSelection();
      }
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('#snapTopbar, #snapActions')) return;

      const handleEl = e.target.closest('.handle');
      if (handleEl && rect) {
        dragMode = handleEl.dataset.handle;
        anchorX = e.clientX;
        anchorY = e.clientY;
        startRect = { ...rect };
        renderRect({ showActions: false });
        return;
      }

      if (e.target === box && rect) {
        dragMode = 'move';
        anchorX = e.clientX;
        anchorY = e.clientY;
        startRect = { ...rect };
        renderRect({ showActions: false });
        return;
      }

      dragMode = 'create';
      anchorX = e.clientX;
      anchorY = e.clientY;
      rect = { x: anchorX, y: anchorY, width: 0, height: 0 };
      renderRect({ showActions: false });
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragMode) return;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const cx = Math.max(0, Math.min(vw, e.clientX));
      const cy = Math.max(0, Math.min(vh, e.clientY));

      if (dragMode === 'create') {
        rect = {
          x: Math.min(anchorX, cx),
          y: Math.min(anchorY, cy),
          width: Math.abs(cx - anchorX),
          height: Math.abs(cy - anchorY)
        };
      } else if (dragMode === 'move' && startRect) {
        const dx = cx - anchorX;
        const dy = cy - anchorY;
        rect = {
          x: Math.max(0, Math.min(vw - startRect.width, startRect.x + dx)),
          y: Math.max(0, Math.min(vh - startRect.height, startRect.y + dy)),
          width: startRect.width,
          height: startRect.height
        };
      } else if (startRect) {
        let left = startRect.x;
        let top = startRect.y;
        let right = startRect.x + startRect.width;
        let bottom = startRect.y + startRect.height;

        if (dragMode.includes('w')) left = Math.min(right - 12, cx);
        if (dragMode.includes('e')) right = Math.max(left + 12, cx);
        if (dragMode.includes('n')) top = Math.min(bottom - 12, cy);
        if (dragMode.includes('s')) bottom = Math.max(top + 12, cy);

        rect = { x: left, y: top, width: right - left, height: bottom - top };
      }

      renderRect({ showActions: false });
    });

    window.addEventListener('mouseup', () => {
      if (!dragMode) return;
      dragMode = null;
      startRect = null;
      if (!rect || rect.width < 8 || rect.height < 8) {
        resetSelection();
        return;
      }
      renderRect({ showActions: true });
    });

    document.getElementById('btnSnapCancel').addEventListener('click', () => {
      window.gxAPI.cancelAreaScreenshot();
    });

    document.getElementById('btnSnapCopy').addEventListener('click', () => {
      const payload = getScaledPayload('copy');
      if (payload) window.gxAPI.finishAreaScreenshot(payload);
    });

    document.getElementById('btnSnapCapture').addEventListener('click', () => {
      const payload = getScaledPayload('save');
      if (payload) window.gxAPI.finishAreaScreenshot(payload);
    });

    document.getElementById('btnCaptureVisible').addEventListener('click', () => {
      window.gxAPI.finishAreaScreenshot({ mode: 'visible' });
    });

    document.getElementById('btnCaptureFull').addEventListener('click', () => {
      window.gxAPI.finishAreaScreenshot({ mode: 'full' });
    });

    document.getElementById('btnSavePdf').addEventListener('click', () => {
      window.gxAPI.savePageAsPdf?.();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.gxAPI.cancelAreaScreenshot();
      } else if (e.key === 'Enter' && rect && rect.width >= 8 && rect.height >= 8) {
        const payload = getScaledPayload('save');
        if (payload) window.gxAPI.finishAreaScreenshot(payload);
      }
    });
  </script>
</body>
</html>
